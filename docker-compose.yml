services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: briefbot
      POSTGRES_USER: briefbot
      POSTGRES_PASSWORD: briefbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefbot"]
      interval: 5s
      timeout: 3s
      retries: 10
  opencode:
    image: ghcr.io/anomalyco/opencode:1.18.17
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    working_dir: /workspace
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_COMPATIBLE_BASE_URL: ${DASHSCOPE_COMPATIBLE_BASE_URL}
      HOME: /tmp/opencode
    volumes:
      - ./.opencode:/workspace/.opencode:ro
      - ./opencode.json:/workspace/opencode.json:ro
    ports:
      - "127.0.0.1:4096:4096"
    user: "1000:1000"
    tmpfs:
      - /tmp
    restart: unless-stopped
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://briefbot:briefbot@postgres:5432/briefbot
      OPENCODE_BASE_URL: http://opencode:4096
    depends_on:
      postgres:
        condition: service_healthy
      opencode:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  postgres_data:
