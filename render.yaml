services:
  - type: web
    name: briefbot
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: briefbot-audio
      mountPath: /var/lib/briefbot
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_MODE
        value: webhook
      - key: DATABASE_URL
        fromDatabase:
          name: briefbot-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: OPENCODE_BASE_URL
        value: http://briefbot-opencode:10000
      - key: OPENCODE_SERVER_USERNAME
        value: opencode
      - key: OPENCODE_SERVER_PASSWORD
        fromService:
          type: pserv
          name: briefbot-opencode
          envVarKey: OPENCODE_SERVER_PASSWORD
      - key: EXTRACTION_MODELS
        value: alibaba/qwen3.8-flash,alibaba/qwen3.7-plus
      - key: OPENCODE_TIMEOUT_MS
        value: "120000"
      - key: STT_BASE_URL
        sync: false
      - key: STT_API_KEY
        sync: false
      - key: STT_MODELS
        value: qwen3-asr-flash,qwen-audio-3.0-asr-flash
      - key: STT_TIMEOUT_MS
        value: "90000"
      - key: AUDIO_STORAGE_DIR
        value: /var/lib/briefbot/audio
      - key: MAX_VOICE_DURATION_SECONDS
        value: "300"
      - key: MAX_TEXT_LENGTH
        value: "12000"
      - key: MAX_VOICE_BYTES
        value: "7500000"
      - key: LOG_LEVEL
        value: info

  - type: pserv
    name: briefbot-opencode
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile.opencode
    envVars:
      - key: OPENCODE_SERVER_USERNAME
        value: opencode
      - key: OPENCODE_SERVER_PASSWORD
        generateValue: true
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_COMPATIBLE_BASE_URL
        sync: false

databases:
  - name: briefbot-db
    databaseName: briefbot
    user: briefbot
    plan: free
    region: frankfurt
